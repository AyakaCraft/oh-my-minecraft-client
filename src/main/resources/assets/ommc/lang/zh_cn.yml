ommc:
  gui:
    title:
      configs: 'Oh My Minecraft Client 设置 - 版本: %s'
  config:
    category:
      all:
        name: 全部
      generic:
        name: 通用
      feature:
        name: 特性
      list:
        name: 列表
    option:
      autoSwitchElytra:
        name: 自动切换鞘翅
        comment: 自动切换鞘翅和胸甲
      betterSneaking:
        name: 更好的潜行
        comment: 在潜行时玩家可以向下移动 1 格高
      blockModelNoOffsetBlacklist:
        name: 方块模型没有偏移列表黑名单
        comment: 方块模型没有偏移列表黑名单
      blockModelNoOffsetListType:
        name: 方块模型没有偏移列表类型
        comment: 方块模型没有偏移列表类型
      blockModelNoOffsetWhitelist:
        name: 方块模型没有偏移列表白名单
        comment: 方块模型没有偏移列表白名单
      breakBlockBlackList:
        name: 破坏方块黑名单
        comment: 如果开启 §6禁止破坏特定方块§r，玩家无法破坏在 §6破坏方块黑名单§r 中的方块
      breakScaffoldingWhiteList:
        name: 破坏脚手架白名单
        comment: 如果开启 §6禁止破坏脚手架§r，玩家只有在使用 §6破坏脚手架白名单§r 中的物品时才能破坏脚手架
      clearWaypoint:
        name: 取消高亮坐标点
        comment: 取消高亮坐标点的快捷键
      debug:
        name: 调试模式
        comment: 开启后将会打印调试日志
      disableBlocklistCheck:
        name: 关闭玩家黑名单检查
        comment: 避免 MC-218167，避免网络请求阻塞主线程
      disableBreakBlock:
        name: 禁止破坏特定方块
        comment: 玩家无法破坏在 §6破坏方块黑名单§r 中的方块
      disableBreakScaffolding:
        name: 禁止破坏脚手架
        comment: 玩家只有在手持 §6破坏脚手架白名单§r 中的物品时才能破坏脚手架
      disableMoveDownInScaffolding:
        name: 禁止在脚手架中下降
        comment: 玩家只有在手持 §6在脚手架中下降白名单§r 中的物品时才能在脚手架下降
      disablePistonPushEntity:
        name: 禁止活塞推动实体
        comment: 通过阻止客户端活塞推动实体（玩家除外）来减少活塞卡顿（比如地毯复制机），会导致一些实体位置渲染错误
      dontClearChatHistory:
        name: 不清空聊天历史记录
        comment: 不清空聊天历史记录，以及输入的历史记录
      englishSearch:
        name: 英语搜索
        comment: 在配方书和创造模式物品栏中启用英文搜索
      flatDigger:
        name: 平坦挖掘
        comment: 只有在潜行时才能挖掘比自己低的方块
      forceBreakingCooldown:
        name: 强制添加破坏冷却
        comment: 玩家在秒破方块后会有 5gt 的破坏冷却时间
      forceParseWaypointFromChat:
        name: 强制从聊天中解析路径点
        comment: 强制从聊天中解析路径点，就算该信息中存在 click event 也会将其覆盖
      highlightBeamTime:
        name: 高亮光柱时间
        comment: 高亮坐标点光束展示时间
      highlightEntityBlackList:
        name: 高亮实体列表黑名单
        comment: 高亮实体列表黑名单
      highlightEntityListType:
        name: 高亮实体列表类型
        comment: 高亮实体列表类型
      highlightEntityWhiteList:
        name: 高亮实体列表白名单
        comment: 高亮实体列表白名单
      highlightLavaSource:
        name: 高亮岩浆源
        comment: 岩浆源将会使用特殊的贴图高亮
      highlightPersistentMob:
        name: 高亮不会消失的怪物
        comment: 高亮不会消失的怪物（受到客户端的限制，现在只能高亮手里有特殊物品或者被命名的怪物）
      highlightPersistentMobClientMode:
        name: 高亮不会消失的怪物客户端模式
        comment: 使用客户端的数据来检查怪物是否会消失，比如手上的物品以及是否有名字，这可能会导致误判。提示：在本地游戏中应该关闭这个选项，在服务器中可以使用 MasaGadget 中的 同步全部实体数据来同步实体信息到本地。
      moveDownInScaffoldingWhiteList:
        name: 在脚手架中下降白名单
        comment: 如果开启 §6禁止在脚手架中下降§r，玩家手中拿着 §6在脚手架中下降白名单§r 中的物品时才能在脚手架下降
      openConfigGui:
        name: 打开设置界面
        comment: 打开设置界面的快捷键
      parseWaypointFromChat:
        name: 从聊天中解析路径点
        comment: 从聊天中解析路径点
      preventIntentionalGameDesign:
        name: 防止刻意的游戏设计
        comment: 防止刻意的游戏设计（床或者重生锚爆炸）
      preventWastageOfWater:
        name: 防止浪费水
        comment: 防止在地狱使用水桶
      realSneaking:
        name: 真潜行
        comment: 玩家在潜行时无法上升或者下降，比如走上或者离开地毯，半砖，台阶这类方块
      removeBreakingCooldown:
        name: 移除挖掘冷却
        comment: 移除在非秒破方块后的挖掘冷却（默认是 5gt），该功能在开启 §6强制添加破坏冷却§r 时不会生效
      sendLookingAtBlockPos:
        name: 发送当前注视的方块的坐标
        comment: 发送当前注视的方块的坐标
      sortInventory:
        name: 整理仓库
        comment: 整理仓库的快捷键
      sortInventoryShulkerBoxLast:
        auto: 自动
        disable: 禁用
        enable: 启用
        name: 整理仓库时潜影盒放在最后
        comment: 整理仓库时潜影盒放在最后
      sortInventorySupportEmptyShulkerBoxStack:
        name: 整理仓库时支持空潜影盒堆叠
        comment: 整理仓库时支持空潜影盒堆叠（请配合 PCA 使用）
      worldEaterMineHelper:
        name: 世吞挖矿助手
        comment: 当 §6世吞挖矿助手白名单§r 中的方块暴露在空气中时，客户端会在它们上方渲染出自己的镜像，方便世吞运维以及挖矿
      worldEaterMineHelperWhitelist:
        name: 世吞挖矿助手白名单
        comment: 如果开启 §6世吞挖矿助手白名单§r，当 §6世吞挖矿助手白名单§r 中的方块暴露在空气中时，客户端会在它们上方渲染出自己的镜像，方便世吞运维以及挖矿
  highlight_waypoint:
    tooltip: 点击以高亮坐标点。再次点击展示光束。
